<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
  <title id="title">Track and Field Training App system flow</title>
  <desc id="desc">A system diagram showing athlete and coach workflows across Running, Jumps, Throws, and Lift, with explicit coaching authorization and Supabase-backed team, assignment, submission, and performance data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1c"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .section { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; }
      .boxTitle { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .body { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .flow { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1536" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1390" cy="70" r="220" fill="#2563eb" opacity="0.08"/>
  <circle cx="130" cy="835" r="250" fill="#22c55e" opacity="0.06"/>

  <text x="80" y="78" class="title">Track &amp; Field Training App</text>
  <text x="80" y="118" class="subtitle">Athlete-owned performance, coach prescriptions, and privacy-scoped team workflows</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="390" height="540" rx="28" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="94" y="214" class="section" fill="#60a5fa">ATHLETE EXPERIENCE</text>
  <text x="94" y="250" class="boxTitle">Personal training remains athlete-owned</text>

  <rect x="94" y="282" width="322" height="86" rx="16" fill="#13233d" stroke="#315f9e"/>
  <text x="118" y="314" class="boxTitle">Four training domains</text>
  <text x="118" y="342" class="small">Running · Jumps · Throws · Lift</text>

  <rect x="94" y="390" width="322" height="116" rx="16" fill="#13233d" stroke="#315f9e"/>
  <text x="118" y="422" class="boxTitle">Log actual performance</text>
  <text x="118" y="450" class="small">Sets, reps, times, weights</text>
  <text x="118" y="472" class="small">Jump / throw attempts and marks</text>
  <text x="118" y="494" class="small">History, calendar, stats, training bests</text>

  <rect x="94" y="528" width="322" height="136" rx="16" fill="#13233d" stroke="#315f9e"/>
  <text x="118" y="560" class="boxTitle">Assignment response</text>
  <text x="118" y="588" class="small">Completed · partial · modified</text>
  <text x="118" y="610" class="small">Skipped · unavailable</text>
  <text x="118" y="632" class="small">Attach eligible athlete-owned workout</text>
  <text x="118" y="654" class="small">Prescription never overwrites performance</text>

  <g filter="url(#shadow)">
    <rect x="565" y="170" width="410" height="540" rx="28" fill="#17152a" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="600" y="214" class="section" fill="#c084fc">TEAM &amp; COACH WORKFLOWS</text>

  <rect x="600" y="252" width="340" height="102" rx="16" fill="#21183a" stroke="#7c3aed"/>
  <text x="624" y="284" class="boxTitle">Team identity &amp; groups</text>
  <text x="624" y="312" class="small">Membership and roster organization</text>
  <text x="624" y="334" class="small">Group membership grants no training access</text>

  <rect x="600" y="376" width="340" height="116" rx="16" fill="#21183a" stroke="#7c3aed"/>
  <text x="624" y="408" class="boxTitle">Explicit coaching authority</text>
  <text x="624" y="436" class="small">Coach-athlete visibility relationship</text>
  <text x="624" y="458" class="small">Domain-scoped prescribe / review rights</text>
  <text x="624" y="480" class="small">Coaches cannot edit athlete performance</text>

  <rect x="600" y="514" width="340" height="150" rx="16" fill="#21183a" stroke="#7c3aed"/>
  <text x="624" y="546" class="boxTitle">Coach training workflow</text>
  <text x="624" y="574" class="small">Reusable workout templates</text>
  <text x="624" y="596" class="small">Team / group / selected-athlete assignments</text>
  <text x="624" y="618" class="small">Materialized recipients and submissions</text>
  <text x="624" y="640" class="small">Formal review with dedicated metadata</text>

  <g filter="url(#shadow)">
    <rect x="1090" y="170" width="386" height="540" rx="28" fill="#0d1f1a" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="1124" y="214" class="section" fill="#4ade80">SUPABASE DATA &amp; AUTHORIZATION</text>

  <rect x="1124" y="252" width="318" height="104" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="1148" y="284" class="boxTitle">Authentication &amp; RLS</text>
  <text x="1148" y="312" class="small">User identity and persistent sessions</text>
  <text x="1148" y="334" class="small">Database-enforced privacy boundaries</text>

  <rect x="1124" y="378" width="318" height="128" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="1148" y="410" class="boxTitle">Training records</text>
  <text x="1148" y="438" class="small">Workouts · entries · sets · field attempts</text>
  <text x="1148" y="460" class="small">Calendar · profiles · bests</text>
  <text x="1148" y="482" class="small">Athlete ownership remains authoritative</text>

  <rect x="1124" y="528" width="318" height="136" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="1148" y="560" class="boxTitle">Team workflow records</text>
  <text x="1148" y="588" class="small">Teams · groups · coaching assignments</text>
  <text x="1148" y="610" class="small">Templates · assignments · recipients</text>
  <text x="1148" y="632" class="small">Submissions · review metadata</text>
  <text x="1148" y="654" class="small">Repository-managed migrations + tests</text>

  <line x1="450" y1="438" x2="560" y2="438" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="975" y1="438" x2="1085" y2="438" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="472" y="412" class="flow">Training actions</text>
  <text x="998" y="412" class="flow">Authorized reads / writes</text>

  <rect x="110" y="770" width="1316" height="86" rx="22" fill="#111827" stroke="#334155"/>
  <text x="140" y="803" class="flow">Pilot boundary</text>
  <text x="260" y="803" class="small">Core coach-athlete workflow is live; responsibility-scope and field-domain migrations are implemented in repo but pending hosted deployment.</text>
  <text x="140" y="833" class="small">Phase 4 Pilot 1 uses staging / EAS preview with 3–5 athletes before broader coach and event-group rollout.</text>
</svg>