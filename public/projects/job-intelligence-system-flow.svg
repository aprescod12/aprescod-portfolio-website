<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
  <title id="title">Personal Job Intelligence Platform system flow</title>
  <desc id="desc">A system diagram showing resume and job inputs moving through controlled Django extraction, human review, verification, deterministic matching, candidate profile snapshots, and application tracking. Future automated discovery, project relevance analysis, and coordinator orchestration are shown separately as roadmap capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1c"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/>
    </marker>
    <marker id="roadmapArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .section { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; }
      .boxTitle { font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .body { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .small { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .flow { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #e2e8f0; }
      .roadmap { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ddd6fe; }
    </style>
  </defs>

  <rect width="1536" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1390" cy="70" r="220" fill="#2563eb" opacity="0.08"/>
  <circle cx="130" cy="835" r="250" fill="#8b5cf6" opacity="0.07"/>

  <text x="80" y="78" class="title">Personal Job Intelligence Platform</text>
  <text x="80" y="118" class="subtitle">Evidence-grounded résumé processing, job evaluation, and application tracking</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="350" height="510" rx="28" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="94" y="214" class="section" fill="#60a5fa">SOURCE INPUTS</text>
  <text x="94" y="250" class="boxTitle">Controlled evidence intake</text>

  <rect x="94" y="286" width="282" height="94" rx="16" fill="#13233d" stroke="#315f9e"/>
  <text x="118" y="318" class="boxTitle">Résumé versions</text>
  <text x="118" y="346" class="small">PDF, DOCX, and TXT documents</text>
  <text x="118" y="368" class="small">Fingerprinting and source history</text>

  <rect x="94" y="402" width="282" height="94" rx="16" fill="#13233d" stroke="#315f9e"/>
  <text x="118" y="434" class="boxTitle">Career profile</text>
  <text x="118" y="462" class="small">Preferences, target roles, priorities</text>
  <text x="118" y="484" class="small">Deal-breakers and manual evidence</text>

  <rect x="94" y="518" width="282" height="116" rx="16" fill="#13233d" stroke="#315f9e"/>
  <text x="118" y="550" class="boxTitle">Job opportunities</text>
  <text x="118" y="578" class="small">Listing text, URL, and source</text>
  <text x="118" y="600" class="small">Requirements and deadlines</text>
  <text x="118" y="622" class="small">Manual intake during development</text>

  <g filter="url(#shadow)">
    <rect x="500" y="170" width="535" height="510" rx="28" fill="#111827" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="535" y="214" class="section" fill="#4ade80">IMPLEMENTED DJANGO WORKFLOW</text>

  <rect x="535" y="252" width="210" height="116" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="558" y="285" class="boxTitle">Extract &amp; ground</text>
  <text x="558" y="313" class="small">Deterministic baseline</text>
  <text x="558" y="335" class="small">Optional OpenAI structured output</text>
  <text x="558" y="357" class="small">Local evidence anchoring</text>

  <rect x="790" y="252" width="210" height="116" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="813" y="285" class="boxTitle">Review &amp; approve</text>
  <text x="813" y="313" class="small">Editable claims and decisions</text>
  <text x="813" y="335" class="small">Human approval boundaries</text>
  <text x="813" y="357" class="small">Immutable audit history</text>

  <rect x="535" y="400" width="210" height="116" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="558" y="433" class="boxTitle">Verify &amp; structure</text>
  <text x="558" y="461" class="small">Listing reliability and status</text>
  <text x="558" y="483" class="small">Duplicate and provenance controls</text>
  <text x="558" y="505" class="small">Required vs. preferred evidence</text>

  <rect x="790" y="400" width="210" height="116" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="813" y="433" class="boxTitle">Evaluate &amp; explain</text>
  <text x="813" y="461" class="small">Deterministic weighted matcher</text>
  <text x="813" y="483" class="small">Strengths, gaps, and blockers</text>
  <text x="813" y="505" class="small">Versioned audit metadata</text>

  <rect x="655" y="548" width="225" height="92" rx="16" fill="#102a22" stroke="#249f62"/>
  <text x="680" y="581" class="boxTitle">Calibrate &amp; validate</text>
  <text x="680" y="609" class="small">Human judgments, blind holdouts,</text>
  <text x="680" y="631" class="small">provider comparisons, regression tests</text>

  <line x1="410" y1="425" x2="495" y2="425" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="425" y="398" class="flow">Validated inputs</text>

  <g filter="url(#shadow)">
    <rect x="1125" y="170" width="350" height="510" rx="28" fill="#17152a" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <text x="1159" y="214" class="section" fill="#c084fc">REVIEWABLE OUTPUTS</text>
  <text x="1159" y="250" class="boxTitle">Evidence and decisions</text>

  <rect x="1159" y="286" width="282" height="94" rx="16" fill="#21183a" stroke="#7c3aed"/>
  <text x="1183" y="318" class="boxTitle">Candidate snapshots</text>
  <text x="1183" y="346" class="small">Versioned approved résumé evidence</text>
  <text x="1183" y="368" class="small">Explicit activation and lineage</text>

  <rect x="1159" y="402" width="282" height="116" rx="16" fill="#21183a" stroke="#7c3aed"/>
  <text x="1183" y="434" class="boxTitle">Match analysis</text>
  <text x="1183" y="462" class="small">Score and fit classification</text>
  <text x="1183" y="484" class="small">Direct, related, and semantic evidence</text>
  <text x="1183" y="506" class="small">Gaps, unknowns, and blockers</text>

  <rect x="1159" y="540" width="282" height="94" rx="16" fill="#21183a" stroke="#7c3aed"/>
  <text x="1183" y="572" class="boxTitle">Application pipeline</text>
  <text x="1183" y="600" class="small">Status, next actions, and deadlines</text>
  <text x="1183" y="622" class="small">User-controlled application decisions</text>

  <line x1="1035" y1="425" x2="1120" y2="425" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1047" y="398" class="flow">Auditable results</text>

  <rect x="80" y="735" width="1376" height="112" rx="24" fill="#151329" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="9 8"/>
  <text x="112" y="772" class="section" fill="#c084fc">SEVEN-AGENT ROADMAP · CONTROLLED, NOT AUTONOMOUS</text>
  <text x="112" y="808" class="roadmap">Candidate Profile</text>
  <text x="285" y="808" class="roadmap">Job Processing</text>
  <text x="448" y="808" class="roadmap">Job Evaluation</text>
  <text x="610" y="808" class="roadmap">Presentation &amp; Tracking</text>
  <text x="840" y="808" class="small">Implemented foundations</text>
  <line x1="1005" y1="802" x2="1062" y2="802" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#roadmapArrow)"/>
  <text x="1080" y="793" class="roadmap">Discovery · Project Relevance · Coordinator</text>
  <text x="1080" y="819" class="small">Planned capabilities under human review gates</text>
</svg>
